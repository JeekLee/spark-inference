# networks/gateway — spark-inference 단일 게이트웨이.
#
# default-safe loopback bind + master key 필수 — CLAUDE.md invariant 11.
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: spark-network-gateway:local
    container_name: spark-inference-gateway
    restart: unless-stopped

    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_HOST_PORT:-10080}:8000"

    environment:
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:?GATEWAY_MASTER_KEY required — see envs/networks/gateway/.env.example}
      GATEWAY_ROUTES_PATH: /app/routes.yaml
      GATEWAY_CODEX_ENABLED: ${GATEWAY_CODEX_ENABLED:-${GATEWAY_CODEX_OCR_ENABLED:-false}}
      GATEWAY_CODEX_BIN: ${GATEWAY_CODEX_BIN:-codex}
      GATEWAY_CODEX_TIMEOUT_SECONDS: ${GATEWAY_CODEX_TIMEOUT_SECONDS:-${GATEWAY_CODEX_OCR_TIMEOUT_SECONDS:-120}}
      GATEWAY_CODEX_MAX_IMAGE_BYTES: ${GATEWAY_CODEX_MAX_IMAGE_BYTES:-${GATEWAY_CODEX_OCR_MAX_BYTES:-10485760}}
      CODEX_HOME: ${GATEWAY_CODEX_HOME:-/codex-home}

    volumes:
      - ./routes.rendered.yaml:/app/routes.yaml:ro

    networks:
      - spark-inference-net

networks:
  spark-inference-net:
    external: true
    name: spark-inference-net
