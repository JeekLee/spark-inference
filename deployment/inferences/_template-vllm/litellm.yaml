# LiteLLM routing fragment for vLLM-served chat/instruct models.
#
# After copying this template to deployment/inferences/<name>/litellm.yaml,
# replace every __NAME__ token with the component directory name (= compose
# service name = served model name).
#
# render.sh appends this fragment to the gateway config ONLY when the
# component is listed in envs/_manifest.<target>.env::INFERENCES.
  - model_name: __NAME__
    litellm_params:
      model: openai/__NAME__
      api_base: http://__NAME__:8000/v1
      api_key: internal
