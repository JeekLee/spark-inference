services:
  litellm:
    # Pin to a specific release tag in production. main-stable moves but is
    # less volatile than main-latest. https://github.com/BerriAI/litellm/releases
    image: ghcr.io/berriai/litellm:${LITELLM_IMAGE_TAG:-main-stable}
    container_name: spark-inference-litellm
    restart: unless-stopped

    # Default bind = 127.0.0.1 (host-only). Override SPARK_LITELLM_BIND in
    # .env.<target> to expose more widely. no-auth gateway + 0.0.0.0 = open
    # for anyone on the network → see CLAUDE.md "불변 규칙 #11".
    ports:
      - "${SPARK_LITELLM_BIND:-127.0.0.1}:${SPARK_LITELLM_PORT:-10080}:8000"

    # Mount the RENDERED config (produced by render.sh from the template +
    # per-component fragments listed in the manifest). Models not in the
    # manifest are NOT routed → /v1/models == boot set (drift-free).
    volumes:
      - ./litellm_config.rendered.yaml:/app/config.yaml:ro

    # No-auth mode: spark-inference runs the gateway on a closed internal
    # network so we do NOT pass LITELLM_MASTER_KEY at all. Setting it (even
    # to empty) makes litellm enforce auth and reject requests.
    environment:
      LITELLM_LOG: ${LITELLM_LOG:-INFO}

    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "8000"
      - "--num_workers"
      - "1"

    networks:
      - spark-inference-net

networks:
  spark-inference-net:
    external: true
    name: spark-inference-net
