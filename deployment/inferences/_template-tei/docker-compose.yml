# Template: copy this directory to `deployment/inferences/<name>/` and
# replace every __NAME__ / __NAME_UPPER__ token with your component name.
#
# TEI (Text Embeddings Inference) serves embedding/reranker models on port 80.
# spark-gateway proxies /v1/embeddings to it (gateway.yaml fragment with
# `kind: inference`, `url: http://__NAME__:80`).
services:
  __NAME__:
    image: ${__NAME_UPPER___IMAGE}
    container_name: spark-inference-__NAME__
    restart: unless-stopped
    runtime: nvidia

    volumes:
      - ${SPARK_MODELS_DIR}/${__NAME_UPPER___MODEL_SUBDIR}:/data:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - '${__NAME_UPPER___GPU:-0}'
              capabilities: [gpu]

    command: >
      --model-id /data
      --max-client-batch-size ${__NAME_UPPER___MAX_BATCH:-1000}
      --max-concurrent-requests ${__NAME_UPPER___MAX_CONCURRENT:-2048}

    networks:
      - spark-inference-net

networks:
  spark-inference-net:
    external: true
    name: spark-inference-net
