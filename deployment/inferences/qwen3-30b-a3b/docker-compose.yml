# Qwen3-30B-A3B-Instruct-2507 (Qwen, MoE 30B total / ~3B active per token,
# non-thinking instruct). BF16 가중치 ~60GB.
# Model card: https://huggingface.co/Qwen/Qwen3-30B-A3B-Instruct-2507
#
# FP8 변형은 GB10(sm_121) + 현 OSS vLLM 이미지의 CUTLASS C3x 커널 미지원으로 보류.
# 재시도 시 NGC nvcr.io/nvidia/vllm 또는 sm_121 포함 upstream 빌드 필요.
services:
  qwen3-30b-a3b:
    image: ${QWEN3_30B_A3B_IMAGE}
    container_name: spark-inference-qwen3-30b-a3b
    restart: unless-stopped
    runtime: nvidia
    ipc: host

    volumes:
      - ${SPARK_MODELS_DIR}/${QWEN3_30B_A3B_MODEL_SUBDIR}:/model:ro

    # NVIDIA_VISIBLE_DEVICES is the only way to express a variable-length
    # GPU list via env interpolation (compose's `device_ids` is a fixed
    # YAML list and cannot be expanded by env vars).
    environment:
      NVIDIA_VISIBLE_DEVICES: ${QWEN3_30B_A3B_GPU_IDS:-0}
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_LOGGING_LEVEL: ${VLLM_LOG_LEVEL:-INFO}

    command: >
      --model /model
      --served-model-name qwen3-30b-a3b
      --port 8000
      --host 0.0.0.0
      --tensor-parallel-size ${QWEN3_30B_A3B_TP_SIZE:-1}
      --gpu-memory-utilization ${QWEN3_30B_A3B_GPU_UTIL:-0.9}
      --max-model-len ${QWEN3_30B_A3B_MAX_LEN:-32768}
      ${QWEN3_30B_A3B_EXTRA_ARGS:-}

    networks:
      - spark-inference-net

networks:
  spark-inference-net:
    external: true
    name: spark-inference-net
