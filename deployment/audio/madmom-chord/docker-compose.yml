# audio/madmom-chord — chord recognition (Madmom CNN+CRF, major/minor).
#
# CPU only — Madmom 은 전적으로 CPU 기반. GPU 자원 안 점유.
# CLAUDE.md invariant 11: 호스트 노출은 default-safe bind + 자체 Bearer auth.
services:
  madmom-chord:
    build:
      context: .
      dockerfile: Dockerfile
    image: spark-audio-madmom-chord:local
    container_name: spark-inference-madmom-chord
    restart: unless-stopped

    ports:
      - "${MADMOM_CHORD_BIND:-127.0.0.1}:${MADMOM_CHORD_HOST_PORT:?set MADMOM_CHORD_HOST_PORT in env}:8000"

    environment:
      MADMOM_CHORD_LOG_LEVEL: ${MADMOM_CHORD_LOG_LEVEL:-INFO}
      AUDIO_MASTER_KEY: ${AUDIO_MASTER_KEY:?AUDIO_MASTER_KEY required}

    networks:
      - spark-inference-net

networks:
  spark-inference-net:
    external: true
    name: spark-inference-net
